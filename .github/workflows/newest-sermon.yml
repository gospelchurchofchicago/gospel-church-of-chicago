# Puts the newest sermons on the website.
#
# Runs at these times, in Chicago winter time. GitHub keeps schedules in
# world time (UTC), so from March to November each one runs an hour later.
#
#   Sunday 3:17 PM     the English Ministry sermon, posted around midday
#   Monday 12:07 AM    the Korean Sunday sermon, which usually finishes
#                      uploading around 11:30 PM Sunday
#   every day 7:17 AM  a catch-up, in case a run above was delayed or
#                      skipped, which GitHub sometimes does when busy
#
# None is on the hour: that is when GitHub is busiest. Each run reads the
# church's channel on YouTube, picks the newest sermon that is actually
# allowed to play on another website, and if that is not the one already
# showing, updates the settings file and republishes the site. Most runs
# find nothing new and change nothing. If a publish ever fails, the next run
# sees that the live site is behind and publishes again.
#
# It does the same for the English Ministry playlist. A problem there only
# shows a warning; it never holds back the Sunday sermon.
#
# If nothing new is found, nothing happens and the site is left alone.
# If YouTube cannot be reached, this job fails, which sends an email --
# that is deliberate, so a quietly broken job does not go unnoticed for
# months.
#
# To switch this off for good: delete this file. The website carries on
# exactly as it is, showing whichever sermon it was last given.
#
# To run it now rather than waiting: Actions -> this workflow ->
# "Run workflow".

name: Use the newest Sunday sermon

on:
  schedule:
    - cron: "17 21 * * 0"       # Sunday 3:17 PM Chicago (winter)
    - cron: "7 6 * * 1"         # Monday 12:07 AM Chicago (winter)
    - cron: "17 13 * * *"       # every day 7:17 AM Chicago (winter)
  workflow_dispatch:

jobs:
  choose:
    name: Find the newest sermon
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write            # to start a publish run of its own
    steps:
      - uses: actions/checkout@v4

      - name: Ask YouTube what is newest
        id: choose
        run: node .github/newest-sermon.mjs

      # The same check every other change goes through. A sermon id should
      # never break the site, but nothing reaches the live site untested.
      - name: Check the site
        if: steps.choose.outputs.changed == 'true'
        run: node .github/check-site.mjs

      - name: Save it
        if: steps.choose.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Show this week's sermon on the site"
          git push

      # A sermon saved by an earlier run whose publish failed is on main but
      # not on the live site, and every later run would find it "already on
      # the site". So compare the live site with main, and publish again if
      # the live site is behind. If the site cannot be read, do nothing.
      - name: Is the live site behind?
        id: live
        if: steps.choose.outputs.changed != 'true'
        run: |
          saved=$(grep -E 'latestSermonId|englishSermonId' assets/js/site.js)
          live=$(curl -fsS https://gospelchurchofchicago.org/assets/js/site.js | grep -E 'latestSermonId|englishSermonId' || true)
          if [ -n "$live" ] && [ "$live" != "$saved" ]; then
            echo "The live site is behind the saved sermons. Publishing again."
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish as a run of its own, started now. GitHub labels each publish
      # with its commit and ignores a second publish under a label it has
      # already used. A run started here is labeled with main as it is now,
      # so it always gets a new label; publishing from inside this run would
      # reuse the label of main before the sermon was saved.
      - name: Publish
        if: steps.choose.outputs.changed == 'true' || steps.live.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
